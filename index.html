<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPronoIA</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --accent: #22c55e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --inner-bg: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 70px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .logo { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .user-badge { background: var(--border-color); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .card h3 { margin-top: 0; font-size: 1rem; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        select, input {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
            background: var(--inner-bg); color: var(--text-color); box-sizing: border-box; font-size: 0.9rem;
        }

        .team-inputs { display: flex; gap: 10px; align-items: center; }

        .btn-generate {
            width: 100%; background: #2563eb; color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 10px;
        }

        .btn-recharge {
            width: 100%; background: var(--accent); color: #000; border: none; padding: 10px;
            border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }

        .nav-tabs {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-color);
            display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border-color); z-index: 1000;
        }

        .tab-item { color: var(--text-muted); font-size: 0.85rem; text-align: center; cursor: pointer; flex: 1; }
        .tab-item.active { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚽ SmartPronoIA</div>
        <div class="user-badge">🪙 <span id="credits-count">10</span> Jetons</div>
    </header>

    <!-- SECTION PRONOS -->
    <div id="section-pronos" class="page-section active">
        <div class="card" id="card-selection">
            <h3>📊 Sélection Rapide</h3>
            <div class="form-group">
                <label>Championnat :</label>
                <select id="league-select">
                    <option value="Ligue 1">⚽ Ligue 1 (France)</option>
                    <option value="Premier League">🇬🇧 Premier League (Angleterre)</option>
                    <option value="La Liga">🇪🇸 La Liga (Espagne)</option>
                    <option value="Serie A">🇮🇹 Serie A (Italie)</option>
                    <option value="Bundesliga">🇩🇪 Bundesliga (Allemagne)</option>
                    <option value="Champions League">🏆 Champions League</option>
                    <option value="CAF Champions League">🌍 Ligue des Champions CAF</option>
                    <option value="Saudi Pro League">🇸🇦 Saudi Pro League</option>
                </select>
            </div>

            <div class="form-group">
                <div class="team-inputs">
                    <input type="text" id="home-team" placeholder="Domicile" value="Paris SG">
                    <span style="color: var(--primary); font-weight: bold;">VS</span>
                    <input type="text" id="away-team" placeholder="Extérieur" value="Marseille">
                </div>
            </div>

            <button id="btn-generate" onclick="handleGenerateAnalysis()" class="btn-generate">⚡ Générer l'Analyse (1 Jeton)</button>
        </div>

        <div class="card">
            <h3>📅 Matchs Réels du Jour</h3>
            <div id="matches-container">
                <div style="background: #0f172a; margin: 8px 0; padding: 10px; border-radius: 6px; border: 1px solid #334155; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size: 0.75rem; color: #94a3b8;">⚽ Ligue 1 (France)</div>
                        <div style="font-size: 0.85rem; font-weight: 600;">Paris SG <span style="color: #38bdf8;">VS</span> Marseille</div>
                    </div>
                    <button onclick="selectMatch('Paris SG', 'Marseille')" style="background:#334155; color:#38bdf8; border:1px solid #38bdf8; padding:5px 10px; border-radius:6px; font-size:0.75rem; font-weight:bold; cursor:pointer;">Choisir</button>
                </div>

                <div style="background: #0f172a; margin: 8px 0; padding: 10px; border-radius: 6px; border: 1px solid #334155; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size: 0.75rem; color: #94a3b8;">🇪🇸 La Liga (Espagne)</div>
                        <div style="font-size: 0.85rem; font-weight: 600;">Real Madrid <span style="color: #38bdf8;">VS</span> FC Barcelona</div>
                    </div>
                    <button onclick="selectMatch('Real Madrid', 'FC Barcelona')" style="background:#334155; color:#38bdf8; border:1px solid #38bdf8; padding:5px 10px; border-radius:6px; font-size:0.75rem; font-weight:bold; cursor:pointer;">Choisir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SECTION DIRECT -->
    <div id="section-direct" class="page-section">
        <div class="card">
            <h3>🔴 Matchs en Direct</h3>
            <div id="live-matches-container">
                <div style="background: #0f172a; margin: 8px 0; padding: 10px; border-radius: 6px; border: 1px solid #334155; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size: 0.75rem; color: #94a3b8;">⚽ Ligue 1 (France)</div>
                        <div style="font-size: 0.85rem; font-weight: 600;">Paris SG <span style="color: #38bdf8;">VS</span> Marseille</div>
                    </div>
                    <button onclick="selectMatch('Paris SG', 'Marseille')" style="background:#334155; color:#38bdf8; border:1px solid #38bdf8; padding:5px 10px; border-radius:6px; font-size:0.75rem; font-weight:bold; cursor:pointer;">Choisir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SECTION COMPTE -->
    <div id="section-compte" class="page-section">
        <div class="card" style="text-align: center;">
            <h3>👤 Mon Compte</h3>
            <p style="font-size: 0.9rem;">Solde actuel : <strong id="account-credits">10</strong> Jetons</p>
            <button class="btn-recharge" onclick="rechargeCredits()">🎬 Obtenir +5 Jetons</button>
        </div>
    </div>

    <!-- MENU DU BAS -->
    <nav class="nav-tabs">
        <div id="tab-pronos" class="tab-item active" onclick="switchTab('pronos')">Pronos</div>
        <div id="tab-direct" class="tab-item" onclick="switchTab('direct')">Direct</div>
        <div id="tab-compte" class="tab-item" onclick="switchTab('compte')">Compte</div>
    </nav>

    <script>
        function getCredits() {
            const saved = localStorage.getItem('smartprono_credits');
            return saved !== null ? parseInt(saved, 10) : 10;
        }

        function syncCreditsUI() {
            const credits = getCredits();
            document.getElementById('credits-count').innerText = credits;
            document.getElementById('account-credits').innerText = credits;
        }

        function updateCredits(count) {
            localStorage.setItem('smartprono_credits', count);
            syncCreditsUI();
        }

        window.selectMatch = function(home, away) {
            document.getElementById('home-team').value = home;
            document.getElementById('away-team').value = away;
            switchTab('pronos');
        };

        window.switchTab = function(tabName) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));

            const targetSection = document.getElementById('section-' + tabName);
            const targetTab = document.getElementById('tab-' + tabName);

            if (targetSection) targetSection.classList.add('active');
            if (targetTab) targetTab.classList.add('active');
        };

        window.handleGenerateAnalysis = function() {
            const home = document.getElementById('home-team').value.trim();
            const away = document.getElementById('away-team').value.trim();

            if (!home || !away) {
                alert("Entrez deux équipes !");
                return;
            }

            let credits = getCredits();
            if (credits <= 0) {
                alert("Plus de jetons ! Rechargez dans l'onglet Compte.");
                return;
            }

            updateCredits(credits - 1);

            const winHome = Math.floor(Math.random() * 25) + 50;
            const winAway = Math.floor(Math.random() * 20) + 15;
            const draw = 100 - (winHome + winAway);
            const confidence = Math.floor(Math.random() * 10) + 85;
            const goalsPredict = (Math.random() * 1.2 + 1.8).toFixed(1);
            const advice = winHome > 55 ? 'Victoire ' + home : 'Plus de 1.5 Buts';

            const oldCard = document.getElementById('ai-result-card');
            if (oldCard) oldCard.remove();

            const shareText = encodeURIComponent(`⚽ Pronostic SmartPronoIA\n${home} vs ${away}\n🎯 Conseil: ${advice}\n🔥 Confiance: ${confidence}%`);

            const card = document.createElement('div');
            card.id = 'ai-result-card';
            card.className = 'card';
            card.style.cssText = "background: #1e293b; border: 2px solid #38bdf8; margin-top: 15px;";

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h4 style="margin:0; color:#38bdf8; font-size:1rem;">🧠 Analyse SmartPronoIA</h4>
                    <span style="background:rgba(34, 197, 94, 0.2); color:#22c55e; border: 1px solid #22c55e; padding:3px 10px; border-radius:12px; font-size:0.75rem; font-weight:bold;">
                        Confiance : ${confidence}%
                    </span>
                </div>

                <div style="text-align:center; padding: 10px; background:#0f172a; border-radius:8px; margin-bottom:12px; border:1px solid #334155;">
                    <div style="font-size:0.95rem; font-weight:bold; color:#f8fafc;">
                        ${home} <span style="color:#38bdf8;">VS</span> ${away}
                    </div>
                </div>

                <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #334155;">
                    <div style="font-size:0.75rem; font-weight:bold; color:#94a3b8; margin-bottom:8px;">📊 PROBABILITÉS DU MATCH</div>
                    <div style="display:flex; height:10px; border-radius:5px; overflow:hidden; background:#334155; margin-bottom:10px;">
                        <div style="width:${winHome}%; background:#38bdf8;"></div>
                        <div style="width:${draw}%; background:#eab308;"></div>
                        <div style="width:${winAway}%; background:#ef4444;"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:0.75rem;">
                        <div style="color:#38bdf8;">🔵 ${home} : <strong>${winHome}%</strong></div>
                        <div style="color:#eab308;">🟡 Nul : <strong>${draw}%</strong></div>
                        <div style="color:#ef4444;">🔴 ${away} : <strong>${winAway}%</strong></div>
                    </div>
                </div>

                <div style="background:#0f172a; padding:12px; border-radius:8px; border-left: 4px solid #22c55e; margin-bottom:12px;">
                    <div style="font-size:0.75rem; color:#94a3b8; font-weight:bold;">🎯 CONSEIL SÉLECTIONNÉ</div>
                    <div style="color:#22c55e; font-size:1rem; font-weight:bold; margin-top:4px;">${advice}</div>
                    <div style="color:#cbd5e1; font-size:0.75rem; margin-top:4px;">Moyenne buts : <strong style="color:#38bdf8;">${goalsPredict}</strong></div>
                </div>

                <a href="https://api.whatsapp.com/send?text=${shareText}" target="_blank" 
                   style="display:block; text-align:center; background:#22c55e; color:#000; font-weight:bold; padding:10px; border-radius:8px; text-decoration:none; font-size:0.85rem;">
                    📲 Partager le Pronostic sur WhatsApp
                </a>
            `;

            document.getElementById('card-selection').after(card);
            card.scrollIntoView({ behavior: 'smooth' });
        };

        window.rechargeCredits = function() {
            updateCredits(getCredits() + 5);
            alert("🎉 +5 Jetons ajoutés à votre solde !");
        };

        document.addEventListener('DOMContentLoaded', () => {
            syncCreditsUI();
        });
    </script>
</body>
</html>
