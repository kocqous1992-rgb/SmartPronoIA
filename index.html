<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPronoIA</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; padding: 15px; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .logo { color: #38bdf8; font-weight: bold; font-size: 1.2rem; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #334155; }
        input, select { width: 100%; padding: 10px; margin: 5px 0 10px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .match-item { background: #0f172a; padding: 10px; border-radius: 5px; margin: 5px 0; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚽ SmartPronoIA</div>
        <div>🪙 <span id="credits-count">10</span> Jetons</div>
    </header>

    <div class="card">
        <h3>📊 Sélection Rapide</h3>
        <label>Championnat</label>
        <select id="league-select">
            <option>Ligue 1 (France)</option>
            <option>Premier League (Angleterre)</option>
            <option>La Liga (Espagne)</option>
            <option>UEFA Champions League</option>
        </select>
        
        <input type="text" id="home-team" placeholder="Équipe Domicile">
        <input type="text" id="away-team" placeholder="Équipe Extérieur">
        
        <button id="btn-generate">⚡ Générer l'Analyse (1 Jeton)</button>
    </div>

    <div class="card">
        <h3>📅 Matchs Réels du Jour</h3>
        <div id="matches-container">
            <div class="match-item">
                <div><strong>Paris SG vs Marseille</strong><br><small style="color:#94a3b8">Ligue 1</small></div>
                <button onclick="document.getElementById('home-team').value='Paris SG'; document.getElementById('away-team').value='Marseille';" style="width:auto; padding:5px 10px; background:#334155;">Choisir</button>
            </div>
            <div class="match-item">
                <div><strong>Real Madrid vs FC Barcelona</strong><br><small style="color:#94a3b8">La Liga</small></div>
                <button onclick="document.getElementById('home-team').value='Real Madrid'; document.getElementById('away-team').value='FC Barcelona';" style="width:auto; padding:5px 10px; background:#334155;">Choisir</button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
